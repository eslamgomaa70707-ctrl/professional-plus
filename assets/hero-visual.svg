<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 900" width="800" height="900">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0D4B34"/>
      <stop offset="100%" stop-color="#06301F"/>
    </linearGradient>
    <linearGradient id="barGrad" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#0D4B34"/>
      <stop offset="100%" stop-color="#2E8B5C"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#B8842F"/>
      <stop offset="100%" stop-color="#E4C27A"/>
    </linearGradient>
  </defs>

  <rect width="800" height="900" fill="url(#bgGrad)"/>

  <!-- faint blueprint grid, evokes structured analysis -->
  <g stroke="#ffffff" stroke-opacity="0.05" stroke-width="1">
    <g id="vlines"></g>
  </g>
  <g stroke="#ffffff" stroke-opacity="0.045" stroke-width="1">
    <line x1="0" y1="150" x2="800" y2="150"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="450" x2="800" y2="450"/>
    <line x1="0" y1="600" x2="800" y2="600"/>
    <line x1="0" y1="750" x2="800" y2="750"/>
    <line x1="100" y1="0" x2="100" y2="900"/>
    <line x1="250" y1="0" x2="250" y2="900"/>
    <line x1="400" y1="0" x2="400" y2="900"/>
    <line x1="550" y1="0" x2="550" y2="900"/>
    <line x1="700" y1="0" x2="700" y2="900"/>
  </g>

  <!-- desk surface line -->
  <line x1="0" y1="690" x2="800" y2="690" stroke="#E4C27A" stroke-opacity="0.25" stroke-width="1.5"/>

  <!-- document / plan sheet -->
  <g transform="translate(120,560)">
    <rect x="0" y="0" width="230" height="130" rx="4" fill="#0B3F2C" stroke="#E4C27A" stroke-opacity="0.35" stroke-width="1"/>
    <line x1="20" y1="30" x2="180" y2="30" stroke="#E4C27A" stroke-opacity="0.55" stroke-width="2"/>
    <line x1="20" y1="55" x2="210" y2="55" stroke="#ffffff" stroke-opacity="0.22" stroke-width="1.5"/>
    <line x1="20" y1="75" x2="210" y2="75" stroke="#ffffff" stroke-opacity="0.22" stroke-width="1.5"/>
    <line x1="20" y1="95" x2="150" y2="95" stroke="#ffffff" stroke-opacity="0.22" stroke-width="1.5"/>
  </g>

  <!-- bar chart, echoing the logo's growth marks -->
  <g transform="translate(400,690)">
    <rect x="0"  y="-90"  width="46" height="90"  fill="url(#barGrad)" opacity="0.9"/>
    <rect x="60" y="-150" width="46" height="150" fill="url(#barGrad)"/>
    <rect x="120" y="-230" width="46" height="230" fill="url(#barGrad)"/>
    <rect x="180" y="-320" width="46" height="320" fill="#2E8B5C"/>
  </g>

  <!-- growth arrow, same gesture as the wordmark -->
  <path d="M 380 610 C 480 560, 560 470, 610 330" fill="none" stroke="url(#goldGrad)" stroke-width="6" stroke-linecap="round"/>
  <path d="M 585 300 L 615 325 L 575 350" fill="none" stroke="url(#goldGrad)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- compass / target mark, small supporting motif -->
  <g transform="translate(640,470)" opacity="0.9">
    <circle r="34" fill="none" stroke="#E4C27A" stroke-width="2"/>
    <circle r="18" fill="none" stroke="#E4C27A" stroke-width="2"/>
    <circle r="4" fill="#E4C27A"/>
  </g>
</svg>
